<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FavFontz</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">
      <img class="logo" src="icons/logo.svg" alt="">
      <h1>FavFontz</h1>
      <span class="count" id="count"></span>
    </div>
    <form class="search" id="addForm" autocomplete="off">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input
        id="addInput"
        placeholder="Search or add a font…"
        aria-label="Search your favorites or add a Google Font"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="list"
        aria-expanded="false"
        spellcheck="false">
      <span class="kbd" id="hint">↵ add</span>
    </form>
  </header>

  <main id="list"></main>

  <footer id="footer" hidden>
    <span id="footCount"></span>
    <button id="copyAll" title="One <link> tag that loads every favorite">Copy embed for all</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
